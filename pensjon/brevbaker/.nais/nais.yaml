apiVersion: "nais.io/v1alpha1"
kind: "Application"
metadata:
  name: {{app-name}}
  namespace: "pensjonsbrev"
  labels:
    "team": "pensjonsbrev"
  annotations:
    haproxy.org/timeout-server: "300s"
spec:
  image: {{image}}
  port: 8080
  terminationGracePeriodSeconds: 60
  service:
    port: 80
    protocol: http
  liveness:
    path: "/isAlive"
    port: 8080
    initialDelay: 20
    timeout: 60
    # initialDelay er lav for at oppskalering ved surge skal gå raskt (readiness styrer
    # trafikk-routing). Liveness er derfor gitt et bredere feilbudsjett i stedet, slik at
    # normal variasjon i JVM-oppstart ikke trigger unødvendige restarter/ContainerCrashlooper.
    # initialDelay + (failureThreshold * periodSeconds) = 20s + 100s = 120s før poden faktisk drepes.
    periodSeconds: 10
    failureThreshold: 10
  readiness:
    path: "/isReady"
    port: 8080
    initialDelay: 20
    timeout: 60
  replicas:
    min: 2
    max: 20
    cpuThresholdPercentage: 50
  prometheus:
    enabled: true
    path: "/metrics"
    port: "8080"
  observability:
    autoInstrumentation:
      enabled: true
      runtime: java
    logging:
      destinations:
        - id: elastic
        - id: loki
  resources:
    requests:
      cpu: "400m"
      memory: "256Mi"
    limits:
      memory: "2Gi"

  azure:
    application:
      enabled: true
      allowAllUsers: false
      claims:
        groups:
          {{#each groups as |group|}}
             - id: {{group}}
          {{/each}}
        extra:
          - azp_name
  accessPolicy:
    outbound:
      rules:
        - application: {{pdf-bygger-app}}
      external:
        - host: teampensjon-unleash-api.nav.cloud.nais.io
    inbound:
      rules:
        {{#each preAuthorized as |app|}}
           - application: {{app.name}}
             namespace: {{app.namespace}}
             cluster: {{app.cluster}}
        {{/each}}
  ingresses:
    {{#each ingresses as |url|}}
       - {{url}}
      {{/each}}
  env:
    - name: PDF_BUILDER_URL
      value: "http://pensjon-pdf-bygger"
    - name: PDF_BYGGER_MAX_RETRIES
      value: "250"
  envFrom:
    - secret: pensjon-brevbaker-unleash-api-token