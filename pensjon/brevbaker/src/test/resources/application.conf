ktor {
    application {
        modules = [ no.nav.pensjon.brev.TestBrevbakerAppKt.brevbakerTestModule ]
    }
}

brevbaker {
    pdfByggerUrl = "kun her for å overskrive fra prodkoden"
    pdfByggerScope = "api://test/pdf-bygger/.default"

    azureAD {
        issuer = "https://test-issuer"
        jwksUrl = "https://test-jwksUrl"
        clientId = "test-clientId"
        tokenEndpoint = "https://test-tokenEndpoint"
        clientSecret = "test-clientSecret"
    }

    unleash {
        # Følgende må være med for å overstyre miljøvariabel-verdier fra main/resources/application.conf.
        useFakeUnleash = true
        appName = "brevbaker"
        environment = "test"
        host = "http://localhost"
        apiToken = "Token123"
    }
}