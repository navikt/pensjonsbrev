apiVersion: "nais.io/v1alpha1"
kind: "Application"
metadata:
  name: {{app-name}}
  namespace: "pensjonsbrev"
  labels:
    "team": "pensjonsbrev"
spec:
  image: {{image}}
  port: 8080
  leaderElection: true
  service:
    port: 80
    protocol: http
  liveness:
    path: "/isAlive"
    port: 8080
    initialDelay: 20
    timeout: 60
    # initialDelay er lav for at oppskalering ved surge skal gå raskt (readiness styrer
    # trafikk-routing). Liveness er derfor gitt et bredere feilbudsjett i stedet, slik at
    # normal variasjon i JVM-oppstart ikke trigger unødvendige restarter/ContainerCrashlooper.
    # initialDelay + (failureThreshold * periodSeconds) = 20s + 100s = 120s før poden faktisk drepes.
    periodSeconds: 10
    failureThreshold: 10
  readiness:
    path: "/isReady"
    port: 8080
    initialDelay: 10
    timeout: 3
  replicas:
    min: 2
    max: 10
    scalingStrategy:
      cpu:
        thresholdPercentage: 70
  prometheus:
    enabled: true
    path: "/metrics"
    port: "8080"
  observability:
    autoInstrumentation:
      enabled: true
      runtime: java
    logging:
      destinations:
        - id: elastic
        - id: loki
  resources:
    requests:
      cpu: "200m"
      memory: "256Mi"
    limits:
      memory: "768Mi"
  gcp:
    sqlInstances:
      - type: {{database.postgresVersion}}
        tier: db-custom-1-3840
        databases:
          - envVarPrefix: DB
            name: skribentendb
        flags:
          - name: "cloudsql.enable_pgaudit"
            value: "{{database.auditlog}}"
          - name: "pgaudit.log"
            value: "read,write,ddl,role"
          - name: "pgaudit.log_parameter"
            value: "on"
  azure:
    application:
      enabled: true
      allowAllUsers: false
      claims:
        groups:
          {{#each groups as |group|}}
             - id: {{group.id}}
          {{/each}}
        extra:
          - azp_name
  valkey:
    - instance: "cache"
      access: readwrite

  accessPolicy:
    outbound:
      rules:
        {{#each outboundRules as |rule|}}
           - application: {{rule.application}}
             namespace: {{rule.namespace}}
             cluster: {{rule.cluster}}
        {{/each}}
      external:
        {{#each externalHosts as |host|}}
          - host: {{host}}
        {{/each}}

    inbound:
      rules:
        {{#each inboundRules as |rule|}}
          - application: {{rule.application}}
            namespace: {{rule.namespace}}
            cluster: {{rule.cluster}}
        {{/each}}
  ingresses:
    {{#each ingresses as |url|}}
    - {{url}}
    {{/each}}
  env:
    {{#each env as |e|}}
      - name: {{e.name}}
        value: "{{{e.value}}}"
    {{/each}}
    {{#each groups as |g|}}
      - name: AD_GROUP_{{g.name}}
        value: {{g.id}}
    {{/each}}
      # ActiveProcessorCount: vi setter ikke limits.cpu, og fra JDK 19 brukes ikke cpu.shares
      # (requests.cpu) til CPU-telling. Uten kvote dimensjonerer JVM-en antall GC-tråder,
      # kompilatortråder og Netty-event-loops etter NODEN og ikke poden, og hver tråd koster
      # 1 MB stakk utenfor heapen.
      # ExitOnOutOfMemoryError: Nettys event loop fanger Throwable, så en OutOfMemoryError kan
      # etterlate appen halvdød mens probene fortsatt svarer. Bedre å dø og la kubernetes restarte.
      # Må være value og ikke valueFrom: OTel-operatoren appender -javaagent til denne variabelen,
      # men hopper stille over den dersom den er satt via valueFrom.
      - name: JAVA_TOOL_OPTIONS
        value: "-XX:ActiveProcessorCount=2 -XX:+ExitOnOutOfMemoryError"
  envFrom:
    - secret: "{{ app-name }}-unleash-api-token"
    - secret: "krypteringsnoekkel"