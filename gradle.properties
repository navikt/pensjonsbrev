kotlin.code.style=official
org.gradle.jvmargs=-Xmx4G -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError

org.gradle.logging.stacktrace=all
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.caching.enabled=true
org.gradle.parallel=true
org.gradle.configuration-cache.problems=warn

systemProp.javaTarget=25
systemProp.apiModelJavaTarget=25
systemProp.markupJavaTarget=25
ksp.incremental=false
kotlin.build.report.output=file
# Lockstep-versjon for alle publiserte brevbaker-artefakter. Modulene deler versjon fordi de slippes
# fra samme repo i samme pipeline, og fordi konsumenter ellers kan havne i versjonssprik paa transitive
# modelltyper (markup:model kommer inn baade via brevbaker-api og via pdf-bygger-dsl).
brevbakerVersion=4.0.0
