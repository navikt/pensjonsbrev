ktor {
    deployment {
        host = "0.0.0.0"
        port = 8080
        port = ${?PORT}
        shutdownGracePeriod = 25000
        shutdownTimeout = 29000
    }
    application {
        modules = [ no.nav.pensjon.brev.brevoppskrift.BrevoppskriftAppKt.brevoppskriftModule ]
    }
}

brevoppskrift {
    azure {
        issuer = ${AZURE_OPENID_CONFIG_ISSUER}
        audience = ${AZURE_APP_CLIENT_ID}
        jwksUri = ${AZURE_OPENID_CONFIG_JWKS_URI}
        preAuthApps = ${AZURE_APP_PRE_AUTHORIZED_APPS}
        editorGroupId = ${EDITOR_GROUP_ID}
    }
    database {
        jdbcUrl = ${?DB_JDBC_URL}
        host = ${?DB_HOST}
        port = 5432
        port = ${?DB_PORT}
        name = ${?DB_DATABASE}
        username = ${DB_USERNAME}
        password = ${DB_PASSWORD}
        maxPoolSize = 3
    }
    integrations {
        webUrl = "https://pensjon-brevoppskrift.intern.dev.nav.no"
        webUrl = ${?PUBLIC_WEB_URL}
        vertex {
            projectId = ${?VERTEX_PROJECT_ID}
            location = ${?VERTEX_LOCATION}
            model = ${?VERTEX_MODEL}
        }
        slackWebhookUrl = ${?SLACK_WEBHOOK_URL}
        github {
            appId = ${?GITHUB_APP_ID}
            installationId = ${?GITHUB_APP_INSTALLATION_ID}
            privateKey = ${?GITHUB_APP_PRIVATE_KEY}
        }
    }
}
