services:
  brevoppskrift:
    build:
      context: brevoppskrift-web/bff
    depends_on:
      pensjon-brevbaker:
        condition: service_started
      brevoppskrift-backend:
        condition: service_started
      brevoppskrift-texas:
        condition: service_started
    env_file:
      - ./brevoppskrift-web/bff/.env
    environment:
      NODE_ENV: "development"
      EXPRESS_PORT: "8088"
      EXPRESS_HOST: "::"
      BREVBAKER_API_URL: "http://pensjon-brevbaker:8080"
      BREVOPPSKRIFT_BACKEND_URL: "http://brevoppskrift-backend:8080"
      BREVOPPSKRIFT_BACKEND_SCOPE: "api://dev-gcp.pensjonsbrev.brevoppskrift-backend/.default"
      PUBLIC_ORIGINS: "http://localhost:8088"
      NAIS_TOKEN_ENDPOINT: "http://brevoppskrift-texas:3000/api/v1/token"
      NAIS_TOKEN_EXCHANGE_ENDPOINT: "http://brevoppskrift-texas:3000/api/v1/token/exchange"
      NAIS_TOKEN_INTROSPECTION_ENDPOINT: "http://brevoppskrift-texas:3000/api/v1/introspect"

  brevoppskrift-backend:
    build: ./brevoppskrift-backend
    depends_on:
      brevoppskrift-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8087:8080"
      - "127.0.0.1:5018:5018"
    env_file:
      - ./brevoppskrift-backend/secrets/azuread.env
    environment:
      PORT: "8080"
      NAIS_APP_NAME: "brevoppskrift-backend"
      DB_HOST: "brevoppskrift-db"
      DB_PORT: "5432"
      DB_DATABASE: "brevoppskrift"
      DB_USERNAME: "brevoppskrift"
      DB_PASSWORD: "local"
      EDITOR_GROUP_ID: "c331c338-5d39-45eb-a9c7-4e909c81768a"
      PUBLIC_WEB_URL: "http://localhost:8088"
      JAVA_TOOL_OPTIONS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5018"

  brevoppskrift-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: brevoppskrift
      POSTGRES_USER: brevoppskrift
      POSTGRES_PASSWORD: local
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "brevoppskrift", "-d", "brevoppskrift"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - brevoppskrift-db:/var/lib/postgresql

  brevoppskrift-wonderwall:
    image: ghcr.io/nais/wonderwall:latest
    platform: linux/amd64
    depends_on:
      brevoppskrift:
        condition: service_started
    ports:
      - "127.0.0.1:8088:8088"
    env_file:
      - ./brevoppskrift-web/bff/.env
    environment:
      WONDERWALL_AUTO_LOGIN: "false"
      WONDERWALL_OPENID_PROVIDER: "azure"
      WONDERWALL_INGRESS: "http://localhost:8088"
      WONDERWALL_BIND_ADDRESS: "0.0.0.0:8088"
      WONDERWALL_UPSTREAM_HOST: "brevoppskrift:8088"
      WONDERWALL_LOG_FORMAT: "text"

  brevoppskrift-texas:
    image: ghcr.io/nais/texas:latest
    env_file:
      - ./brevoppskrift-web/bff/.env
    environment:
      BIND_ADDRESS: "0.0.0.0:3000"
      AZURE_ENABLED: "true"
      TEXAS_HTTP_CONNECT_TIMEOUT_MILLIS: "10000"
      TEXAS_HTTP_READ_TIMEOUT_MILLIS: "10000"
      TEXAS_HTTP_OVERALL_TIMEOUT_MILLIS: "10000"

networks:
  default:
    name: brevoppskrift-local

volumes:
  brevoppskrift-db:
