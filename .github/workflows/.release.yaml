name: .release.yaml

on:
  workflow_call:
    inputs:
      gradleTarget:
        description: "gradle project path, or space separated list of project paths"
        required: true
        type: string
      release-common-result:
        description: "Result from release-common"
        required: true
        type: string
      changes:
        description: "Changes"
        required: true
        type: string
      dependsOnCommon:
        description: "Depends on common"
        required: false
        type: boolean
        default: true

env:
  JavaDistribution: "temurin"
  JavaVersion: 25

jobs:
  release:
    runs-on: "ubuntu-latest"
    permissions:
      packages: write
    if: ${{ (inputs.release-common-result == 'success' || inputs.release-common-result == 'skipped' || github.event_name == 'workflow_dispatch') }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-encryption-key: ${{ secrets.GRADLEKEY }}
      - uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          "distribution": ${{ env.JavaDistribution }}
          "java-version": ${{ env.JavaVersion }}
      # api-modellene konsumeres ved publiserte koordinater og drar inn brevdata transitivt,
      # så bibliotekets artefakter må ligge i Maven local før de bygges.
      - name: "publish brevbaker-biblioteket to Maven local"
        if: ${{ inputs.dependsOnCommon }}
        run: |
          ./gradlew :brevbaker:brevdata:publishToMavenLocal :brevbaker:markup-model:publishToMavenLocal :brevbaker:markup-dsl:publishToMavenLocal :brevbaker:pdf-bygger-api:publishToMavenLocal :brevbaker:pdf-bygger-dsl:publishToMavenLocal :brevbaker:brevbaker-api:publishToMavenLocal
      - name: "compile and run tests"
        env:
          GRADLE_TARGETS: ${{ inputs.gradleTarget }}
        run: |
          tasks=""
          for target in $GRADLE_TARGETS; do tasks="$tasks :$target:build"; done
          ./gradlew $tasks
      - name: "Release maven artifact"
        if: ${{ github.ref == 'refs/heads/main' && inputs.changes == 'true' }}
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          GRADLE_TARGETS: ${{ inputs.gradleTarget }}
        run: |
          tasks=""
          for target in $GRADLE_TARGETS; do tasks="$tasks :$target:publish"; done
          ./gradlew $tasks -Dorg.gradle.configuration-cache=false
      - name: "Release maven manually"
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          GRADLE_TARGETS: ${{ inputs.gradleTarget }}
        run: |
          tasks=""
          for target in $GRADLE_TARGETS; do tasks="$tasks :$target:publish"; done
          ./gradlew -Pversion="0-$(TZ="Europe/Oslo" date +%Y.%m.%d-%H.%M)-$(git rev-parse --short=12 HEAD)" $tasks -Dorg.gradle.configuration-cache=false
