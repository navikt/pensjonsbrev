name: "Build and release brevbaker-api-models"
on:
  workflow_dispatch:
  pull_request:
    branches:
      - "main"
    paths:
      - "pensjon/api-model/**"
      - "alder/api-model/**"
      - "ufoere/api-model/**"
      - ".github/workflows/.build-backend.yaml"
      - ".github/workflows/.release.yaml"
      - ".github/workflows/brevbaker-api-model.yaml"
      - "gradle/wrapper/gradle-wrapper.jar"
      - "gradle/wrapper/gradle-wrapper.properties"
  push:
    branches:
      - "main"
    paths:
      - "pensjon/api-model/**"
      - "alder/api-model/**"
      - "ufoere/api-model/**"
      - ".github/workflows/.build-backend.yaml"
      - ".github/workflows/.release.yaml"
      - ".github/workflows/brevbaker-api-model.yaml"
      - "gradle/wrapper/gradle-wrapper.jar"
      - "gradle/wrapper/gradle-wrapper.properties"

permissions:
  packages: write

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      pensjonsbrev: ${{ steps.changes.outputs.pensjonsbrev }}
      aldersbrev: ${{ steps.changes.outputs.aldersbrev }}
      ufoerebrev: ${{ steps.changes.outputs.ufoerebrev }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: changes
        with:
          filters: |
            pensjonsbrev:
              - 'pensjon/api-model/**'
            aldersbrev:
              - 'alder/api-model/**'
            ufoerebrev:
              - 'ufoere/api-model/**'

  release-pensjon:
    name: "pensjon-brevbaker-api-model"
    uses: ./.github/workflows/.release.yaml
    secrets: inherit
    needs: [ changes ]
    with:
      gradleTarget: 'pensjon:api-model'
      release-common-result: 'success'
      changes: ${{ needs.changes.outputs.pensjonsbrev }}

  release-alder:
    name: "alder-api-model"
    uses: ./.github/workflows/.release.yaml
    secrets: inherit
    needs: [ changes ]
    with:
      gradleTarget: 'alder:api-model'
      release-common-result: 'success'
      changes: ${{ needs.changes.outputs.aldersbrev }}

  release-ufoere:
    name: "ufoere-api-model"
    uses: ./.github/workflows/.release.yaml
    secrets: inherit
    needs: [ changes ]
    with:
      gradleTarget: 'ufoere:api-model'
      release-common-result: 'success'
      changes: ${{ needs.changes.outputs.ufoerebrev }}

  klarTilMerge:
    name: "Klar til merge"
    needs: [release-pensjon, release-alder, release-ufoere]
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/pr
