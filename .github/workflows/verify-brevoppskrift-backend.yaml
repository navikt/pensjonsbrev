name: "verify: brevoppskrift-backend"

on:
  pull_request:
    branches:
      - main
    paths:
      - brevoppskrift-backend/**
      - ufoere/**
      - pensjon/maler/**
      - pensjon/brevbaker/src/**
      - alder/**
      - planlegge-pensjon-maler/**
      - brevbaker/dsl/**
      - ktlint-rules/**
      - settings.gradle.kts
      - build.gradle.kts
      - gradle.properties
      - gradle/**
      - .github/workflows/verify-brevoppskrift-backend.yaml
      - .github/workflows/deploy-brevoppskrift-backend.yaml
      - .github/workflows/.build-backend.yaml
      - .github/workflows/.deploy.yaml
      - .github/workflows/.salsa.yaml
  workflow_dispatch:
  workflow_call:
    inputs:
      buildImage:
        type: boolean
        default: false
    outputs:
      image:
        description: Verified backend image
        value: ${{ jobs.build.outputs.image }}

permissions:
  contents: read
  packages: read
  id-token: write

jobs:
  build:
    uses: ./.github/workflows/.build-backend.yaml
    with:
      image_suffix: brevoppskrift-backend
      path: brevoppskrift-backend
      target: brevoppskrift-backend
      gradleTarget: brevoppskrift-backend
      buildTask: build
      buildImage: ${{ inputs.buildImage || false }}
    secrets: inherit
  verify:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-encryption-key: ${{ secrets.GRADLEKEY }}
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 25
      - name: Prepare published dependencies
        run: ./gradlew :brevbaker:brevdata:publishToMavenLocal :brevbaker:markup-model:publishToMavenLocal :brevbaker:markup-dsl:publishToMavenLocal :brevbaker:brevbaker-api:publishToMavenLocal
      - name: Generate API contract
        run: ./gradlew :brevoppskrift-backend:generateAuthoringApi
      - name: Check generated frontend contract
        run: git diff --exit-code -- brevoppskrift-web/frontend/src/api/brevoppskrift-api.generated.ts
      - name: Compile generated templates in target profiles
        run: ./gradlew :brevoppskrift-backend:verifyGeneratedTemplates --no-configuration-cache
