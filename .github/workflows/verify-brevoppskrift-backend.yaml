name: "verify: brevoppskrift-backend"

on:
  pull_request:
    paths:
      - brevoppskrift-backend/**
      - ufoere/**
      - pensjon/**
      - alder/**
      - planlegge-pensjon-maler/**
      - brevbaker/**
      - ktlint-rules/**
      - settings.gradle.kts
      - build.gradle.kts
      - gradle.properties
      - gradle/**
      - .tool-versions
      - brevoppskrift-web/frontend/src/verksted/api-types.ts
      - .github/workflows/verify-brevoppskrift-backend.yaml
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-encryption-key: ${{ secrets.GRADLEKEY }}
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 25
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".tool-versions"
          cache: npm
          cache-dependency-path: brevoppskrift-backend/openapi/package-lock.json
      - name: Verify backend application
        run: ./gradlew :brevoppskrift-backend:build
      - name: Verify generated API contract
        run: |
          ./gradlew :brevoppskrift-backend:generateApiTypes
          git diff --exit-code -- brevoppskrift-web/frontend/src/verksted/api-types.ts
      - name: Prepare published dependencies
        run: ./gradlew :brevbaker:brevdata:publishToMavenLocal :brevbaker:markup-model:publishToMavenLocal :brevbaker:markup-dsl:publishToMavenLocal :brevbaker:brevbaker-api:publishToMavenLocal
      - name: Compile and render generated templates in target profiles
        run: ./gradlew :brevoppskrift-backend:verifyGeneratedTemplates --no-configuration-cache

  klarTilMerge:
    name: "Klar til merge"
    needs: [verify]
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/pr
