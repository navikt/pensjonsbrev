name: "Build and release brevbaker-biblioteket"
on:
  workflow_dispatch:
  pull_request:
    branches:
      - "main"
    paths:
      - "brevbaker/markup/**"
      - "brevbaker/brevdata/**"
      - "brevbaker/brevbaker-api/**"
      - "gradle/libs.versions.toml"
      - ".github/workflows/.build-backend.yaml"
      - ".github/workflows/.release.yaml"
      - ".github/workflows/brevbaker-bibliotek.yaml"
      - "gradle/wrapper/gradle-wrapper.jar"
      - "gradle/wrapper/gradle-wrapper.properties"
  push:
    branches:
      - "main"
    paths:
      - "brevbaker/markup/**"
      - "brevbaker/brevdata/**"
      - "brevbaker/brevbaker-api/**"
      - "gradle/libs.versions.toml"
      - ".github/workflows/.build-backend.yaml"
      - ".github/workflows/.release.yaml"
      - ".github/workflows/brevbaker-bibliotek.yaml"
      - "gradle/wrapper/gradle-wrapper.jar"
      - "gradle/wrapper/gradle-wrapper.properties"

permissions:
  packages: write

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      brevdata: ${{ steps.changes.outputs.brevdata }}
      markup: ${{ steps.changes.outputs.markup }}
      brevbakerApi: ${{ steps.changes.outputs.brevbakerApi }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: changes
        with:
          filters: |
            brevdata:
              - 'brevbaker/brevdata/**'
              - 'gradle/libs.versions.toml'
            markup:
              - 'brevbaker/markup/**'
              - 'gradle/libs.versions.toml'
            brevbakerApi:
              - 'brevbaker/brevbaker-api/**'
              - 'gradle/libs.versions.toml'

  # Artefaktene har hver sin versjon i gradle/libs.versions.toml og slippes derfor hver for seg.
  # Rekkefølgen er ikke valgfri: POM-en til et artefakt peker på avhengighetene sine ved koordinat,
  # så brevdata og markup må være publisert før brevbaker-api.
  release-brevdata:
    name: "brevdata"
    uses: ./.github/workflows/.release.yaml
    secrets: inherit
    needs: [ changes ]
    with:
      gradleTarget: 'brevbaker:brevdata'
      release-common-result: 'success'
      changes: ${{ needs.changes.outputs.brevdata }}
      dependsOnCommon: false

  release-markup:
    name: "markup"
    uses: ./.github/workflows/.release.yaml
    secrets: inherit
    needs: [ changes ]
    with:
      gradleTarget: 'brevbaker:markup-model brevbaker:markup-dsl'
      release-common-result: 'success'
      changes: ${{ needs.changes.outputs.markup }}
      dependsOnCommon: false

  release-brevbaker-api:
    name: "brevbaker-api"
    uses: ./.github/workflows/.release.yaml
    secrets: inherit
    needs: [ changes, release-brevdata, release-markup ]
    with:
      gradleTarget: 'brevbaker:brevbaker-api'
      release-common-result: 'success'
      changes: ${{ needs.changes.outputs.brevbakerApi }}
      dependsOnCommon: false

  klarTilMerge:
    name: "Klar til merge"
    needs: [ release-brevdata, release-markup, release-brevbaker-api ]
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/pr
