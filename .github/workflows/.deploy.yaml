name: .deploy.yaml

on:
  workflow_call:
    inputs:
      image:
        description: 'Image to deploy'
        required: true
        type: string
      resource:
        description: 'Resources to deploy'
        required: true
        type: string
      vars:
        description: 'Variables to deploy'
        required: true
        type: string
      cluster:
        description: 'Cluster to deploy to'
        required: true
        type: string

jobs:
  deploy:
    name: Deploy app
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    if: ${{
      (inputs.cluster == 'dev-gcp' && (((github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main' )  || github.event_name == 'workflow_dispatch')) ||
      (inputs.cluster == 'prod-gcp' && (github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch'))) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Deploy to ${{ inputs.cluster }}
        uses: nais/deploy/actions/deploy@3944168fd20b7eea3818e97de3810f74b54c78ff # v2
        env:
          CLUSTER: ${{ inputs.cluster }}
          RESOURCE: ${{ inputs.resource }}
          VAR: image=${{ inputs.image }}
          VARS: ${{ inputs.vars }}