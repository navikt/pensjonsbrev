name: "Build and deploy asciidoc to github pages"
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/asciidoctor.yaml"
  push:
    branches:
      - "main"
    paths:
      - "docs/**"
      - ".github/workflows/asciidoctor.yaml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build_site:
    name: "build asciidoc for github pages"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".tool-versions"

      - name: Install Dependencies
        working-directory: docs
        run: npm ci

      - name: Build Antora Site
        working-directory: docs
        run: |
          for attempt in 1 2 3; do
            if output=$(npm run build 2>&1); then
              printf '%s\n' "$output"
              exit 0
            else
              status=$?
            fi

            printf '%s\n' "$output"
            if [[ "$output" != *"Failed to download UI bundle:"* || "$attempt" -eq 3 ]]; then
              exit "$status"
            fi

            echo "Antora UI bundle download failed; retrying in 5 seconds (attempt $((attempt + 1))/3)."
            sleep 5
          done

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/build/site

  deploy:
    name: "deploy to github pages"
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build_site
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  "klarTilMerge":
    name: "Klar til merge"
    needs: [build_site]
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/pr
